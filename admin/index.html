<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Evergreen Media — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --forest:#1f5c3a;--forest-d:#163f28;--forest-l:#2a7a4e;
  --gold:#b89a4e;--gold-l:#d4b96a;
  --ivory:#f7f3ec;--ivory-s:#ede8df;
  --ink:#2c2a26;--ink-m:#5a5650;--ink-l:#9a9590;
  --white:#ffffff;
  --red:#dc2626;--red-l:#fef2f2;
  --green:#16a34a;--green-l:#f0fdf4;
  --orange:#ea580c;--orange-l:#fff7ed;
  --blue:#2563eb;--blue-l:#eff6ff;
  --radius:8px;--radius-sm:5px;--radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.1);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
  --sidebar-w:240px;
  --header-h:60px;
  --transition:all .18s ease;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--ivory);color:var(--ink);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
img{max-width:100%}
.hidden{display:none!important}

/* ── Login Screen ─────────────────────────────────────────── */
#login-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--forest-d) 0%,var(--forest) 100%);
  z-index:9999;
}
.login-card{
  background:var(--white);border-radius:var(--radius-lg);padding:40px;
  width:100%;max-width:400px;box-shadow:var(--shadow-lg);
}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:22px;font-weight:700;color:var(--forest);letter-spacing:.05em}
.login-logo p{font-size:12px;color:var(--ink-l);margin-top:2px;letter-spacing:.15em;text-transform:uppercase}
.login-card h2{font-size:18px;font-weight:600;margin-bottom:20px;color:var(--ink)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--ink-m);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.form-control{
  width:100%;padding:10px 12px;border:1.5px solid #e0dbd4;border-radius:var(--radius-sm);
  background:var(--white);color:var(--ink);transition:var(--transition);outline:none;
}
.form-control:focus{border-color:var(--forest);box-shadow:0 0 0 3px rgba(31,92,58,.1)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 18px;border-radius:var(--radius-sm);font-weight:500;font-size:13px;
  border:none;transition:var(--transition);white-space:nowrap;
}
.btn-primary{background:var(--forest);color:var(--white)}
.btn-primary:hover{background:var(--forest-d)}
.btn-gold{background:var(--gold);color:var(--white)}
.btn-gold:hover{background:var(--gold-l)}
.btn-outline{background:transparent;color:var(--ink-m);border:1.5px solid #ddd}
.btn-outline:hover{border-color:var(--forest);color:var(--forest)}
.btn-danger{background:var(--red);color:var(--white)}
.btn-danger:hover{opacity:.88}
.btn-success{background:var(--green);color:var(--white)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%;padding:12px}
.btn-icon{padding:7px;width:32px;height:32px;border-radius:var(--radius-sm)}
#login-error{color:var(--red);font-size:13px;margin-top:12px;text-align:center}

/* ── App Shell ────────────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ──────────────────────────────────────────────── */
#sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--forest-d);color:var(--white);
  display:flex;flex-direction:column;overflow-y:auto;
  transition:var(--transition);
}
.sidebar-logo{
  padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;
}
.sidebar-logo span{font-size:16px;font-weight:700;letter-spacing:.04em}
.sidebar-logo small{color:var(--gold);font-size:10px;letter-spacing:.15em;text-transform:uppercase;display:block}
.nav-section{padding:12px 0 4px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);padding-left:20px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 20px;
  cursor:pointer;transition:var(--transition);color:rgba(255,255,255,.65);font-size:13px;
  border-left:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:var(--white)}
.nav-item.active{background:rgba(255,255,255,.1);color:var(--white);border-left-color:var(--gold)}
.nav-item i{width:16px;text-align:center;font-size:14px}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
.admin-info{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.admin-avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.admin-name{font-size:13px;font-weight:500}
.admin-role{font-size:11px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em}

/* ── Main content ─────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Header ───────────────────────────────────────────────── */
#header{
  height:var(--header-h);background:var(--white);border-bottom:1px solid #e8e3db;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;box-shadow:var(--shadow);flex-shrink:0;
}
.page-title{font-size:18px;font-weight:600;color:var(--ink)}
.header-actions{display:flex;align-items:center;gap:12px}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;
}
.badge-pending{background:var(--orange-l);color:var(--orange)}
.badge-confirmed{background:var(--blue-l);color:var(--blue)}
.badge-processing{background:#fef3c7;color:#d97706}
.badge-shipped{background:#ede9fe;color:#7c3aed}
.badge-delivered{background:var(--green-l);color:var(--green)}
.badge-cancelled{background:var(--red-l);color:var(--red)}
.badge-paid{background:var(--green-l);color:var(--green)}
.badge-failed{background:var(--red-l);color:var(--red)}
.badge-active{background:var(--green-l);color:var(--green)}
.badge-inactive{background:var(--red-l);color:var(--red)}
.badge-approved{background:var(--green-l);color:var(--green)}
.badge-hidden{background:#f1f5f9;color:#64748b}
.badge-category{background:#ede9fe;color:#7c3aed}
.badge-sm{font-size:10px;padding:1px 6px}

/* ── Content area ─────────────────────────────────────────── */
#content{flex:1;overflow-y:auto;padding:24px}

/* ── Cards & Panels ───────────────────────────────────────── */
.card{background:var(--white);border-radius:var(--radius);border:1px solid #e8e3db;overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid #f0ebe3;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:15px;font-weight:600}
.card-body{padding:20px}
.card-footer{padding:14px 20px;border-top:1px solid #f0ebe3;background:var(--ivory)}

/* ── Stats grid ───────────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--white);border:1px solid #e8e3db;border-radius:var(--radius);
  padding:20px;display:flex;flex-direction:column;gap:6px;
}
.stat-label{font-size:11px;font-weight:500;color:var(--ink-l);text-transform:uppercase;letter-spacing:.08em}
.stat-value{font-size:28px;font-weight:700;color:var(--ink)}
.stat-icon{font-size:20px;margin-bottom:4px}
.stat-meta{font-size:11px;color:var(--ink-l)}
.stat-green .stat-icon{color:var(--green)}
.stat-gold .stat-icon{color:var(--gold)}
.stat-blue .stat-icon{color:var(--blue)}
.stat-orange .stat-icon{color:var(--orange)}
.stat-red .stat-icon{color:var(--red)}

/* ── Table ────────────────────────────────────────────────── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid #f0ebe3;white-space:nowrap}
th{font-size:11px;font-weight:600;color:var(--ink-l);text-transform:uppercase;letter-spacing:.06em;background:var(--ivory)}
td{font-size:13px;color:var(--ink)}
tr:hover td{background:#faf7f3}
.td-img{width:44px;height:44px;border-radius:var(--radius-sm);object-fit:cover;background:var(--ivory-s)}

/* ── Toolbar ──────────────────────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--white);
  border:1.5px solid #e0dbd4;border-radius:var(--radius-sm);padding:8px 12px;
  flex:1;min-width:220px;max-width:340px;
}
.search-box input{border:none;outline:none;width:100%;background:transparent;color:var(--ink)}
.search-box i{color:var(--ink-l)}
.filter-select{
  padding:8px 12px;border:1.5px solid #e0dbd4;border-radius:var(--radius-sm);
  background:var(--white);color:var(--ink);outline:none;
}

/* ── Modal ────────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;
  overflow-y:auto;
}
.modal{
  background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:680px;
  box-shadow:var(--shadow-lg);margin:auto;
}
.modal-header{padding:18px 22px;border-bottom:1px solid #efe9e0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:18px;color:var(--ink-l);cursor:pointer;padding:4px}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:22px}
.modal-footer{padding:16px 22px;border-top:1px solid #efe9e0;display:flex;justify-content:flex-end;gap:10px}

/* ── Form styles ──────────────────────────────────────────── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form-check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.form-check input{width:15px;height:15px;cursor:pointer;accent-color:var(--forest)}
textarea.form-control{resize:vertical;min-height:80px}
.field-help{font-size:11px;color:var(--ink-l);margin-top:4px}

/* ── Image upload ─────────────────────────────────────────── */
.img-upload-zone{
  border:2px dashed #d5cfc7;border-radius:var(--radius);padding:24px;text-align:center;
  cursor:pointer;transition:var(--transition);background:var(--ivory);
}
.img-upload-zone:hover{border-color:var(--forest);background:#f0f7f3}
.img-upload-zone input{display:none}
.img-preview-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.img-thumb{position:relative;width:80px;height:80px}
.img-thumb img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius-sm)}
.img-thumb-del{
  position:absolute;top:-6px;right:-6px;background:var(--red);color:var(--white);
  border:none;border-radius:50%;width:18px;height:18px;font-size:10px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.img-thumb-star{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:var(--white);border:none;border-radius:4px;
  font-size:9px;padding:1px 5px;cursor:pointer;white-space:nowrap;
}

/* ── Pagination ───────────────────────────────────────────── */
.pagination{display:flex;align-items:center;gap:6px;padding:14px 0 0;justify-content:center}
.page-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);border:1.5px solid #ddd;
  background:var(--white);color:var(--ink-m);display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;transition:var(--transition);
}
.page-btn:hover,.page-btn.active{background:var(--forest);color:var(--white);border-color:var(--forest)}
.page-info{font-size:12px;color:var(--ink-l);margin:0 6px}

/* ── Toast ────────────────────────────────────────────────── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:12px 18px;border-radius:var(--radius);color:var(--white);font-size:13px;font-weight:500;
  box-shadow:var(--shadow-md);animation:slideIn .25s ease;min-width:240px;max-width:360px;
  display:flex;align-items:center;gap:10px;
}
.toast-success{background:var(--green)}
.toast-error{background:var(--red)}
.toast-info{background:var(--forest)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── Loader ───────────────────────────────────────────────── */
.loader{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--ink-l)}
.spinner{width:24px;height:24px;border:3px solid #eee;border-top-color:var(--forest);border-radius:50%;animation:spin .7s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Dashboard charts placeholder ────────────────────────── */
.chart-placeholder{background:var(--ivory);border-radius:var(--radius);height:200px;display:flex;align-items:center;justify-content:center;color:var(--ink-l);font-size:13px;border:1px dashed #ddd}

/* ── Order detail ─────────────────────────────────────────── */
.order-items-table td{white-space:normal}
.product-cell{display:flex;align-items:center;gap:10px}
.product-cell img{width:40px;height:40px;border-radius:4px;object-fit:cover;background:var(--ivory-s)}

/* ── Low stock bar ────────────────────────────────────────── */
.stock-bar{display:flex;align-items:center;gap:8px}
.stock-track{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden;min-width:60px}
.stock-fill{height:100%;border-radius:3px;transition:width .3s}
.stock-ok{background:var(--green)}
.stock-low{background:var(--orange)}
.stock-out{background:var(--red)}

/* ── Misc ─────────────────────────────────────────────────── */
.text-muted{color:var(--ink-l)}
.text-sm{font-size:12px}
.text-right{text-align:right}
.fw-600{font-weight:600}
.gap-2{gap:8px}
.mt-12{margin-top:12px}
.mt-16{margin-top:16px}
.flex{display:flex}
.flex-col{flex-direction:column}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.flex-1{flex:1}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.p-16{padding:16px}
.empty-state{text-align:center;padding:48px 24px;color:var(--ink-l)}
.empty-state i{font-size:36px;margin-bottom:12px;display:block;opacity:.35}
.empty-state p{font-size:14px}
.divider{border:none;border-top:1px solid #eee;margin:16px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:var(--ivory-s);color:var(--ink-m);margin:2px}
.required::after{content:" *";color:var(--red)}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <h1>🌿 EVERGREEN MEDIA</h1>
      <p>MEX Admin Panel</p>
    </div>
    <h2>Sign In</h2>
    <div class="form-group">
      <label class="required">Email</label>
      <input id="login-email" type="email" class="form-control" placeholder="admin@evergreenmedia.in" value="admin@evergreenmedia.in" />
    </div>
    <div class="form-group">
      <label class="required">Password</label>
      <input id="login-password" type="password" class="form-control" placeholder="••••••••" />
    </div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">
      <i class="fa fa-sign-in-alt"></i> Sign In
    </button>
    <div id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div style="font-size:22px">🌿</div>
      <div><span>EVERGREEN</span><small>MEX Admin</small></div>
    </div>
    <div class="nav-section">Overview</div>
    <div class="nav-item active" data-page="dashboard"><i class="fa fa-tachometer-alt"></i> Dashboard</div>
    <div class="nav-section">Catalogue</div>
    <div class="nav-item" data-page="products"><i class="fa fa-box"></i> Products</div>
    <div class="nav-item" data-page="categories"><i class="fa fa-tags"></i> Categories</div>
    <div class="nav-section">Sales</div>
    <div class="nav-item" data-page="orders"><i class="fa fa-shopping-bag"></i> Orders</div>
    <div class="nav-item" data-page="coupons"><i class="fa fa-ticket-alt"></i> Coupons</div>
    <div class="nav-section">Community</div>
    <div class="nav-item" data-page="customers"><i class="fa fa-users"></i> Customers</div>
    <div class="nav-item" data-page="reviews"><i class="fa fa-star"></i> Reviews</div>
    <div class="nav-section">System</div>
    <div class="nav-item" data-page="settings"><i class="fa fa-cog"></i> Settings</div>
    <div class="sidebar-footer">
      <div class="admin-info">
        <div class="admin-avatar" id="admin-avatar">A</div>
        <div><div class="admin-name" id="admin-name">Admin</div><div class="admin-role" id="admin-role">superadmin</div></div>
      </div>
      <button class="btn btn-outline btn-sm" style="width:100%" onclick="doLogout()"><i class="fa fa-sign-out-alt"></i> Logout</button>
    </div>
  </nav>

  <!-- Main -->
  <div id="main">
    <div id="header">
      <div class="page-title" id="page-title">Dashboard</div>
      <div class="header-actions">
        <span class="text-muted text-sm" id="header-date"></span>
      </div>
    </div>
    <div id="content">
      <div class="loader"><div class="spinner"></div> Loading…</div>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
/* ── Config ─────────────────────────────────────────────────── */
const API = window.location.origin + '/evergreen-emporium/api';
let TOKEN = localStorage.getItem('em_admin_token') || '';
let ADMIN  = JSON.parse(localStorage.getItem('em_admin') || 'null');

/* ── API helper ─────────────────────────────────────────────── */
async function api(method, path, body = null, isForm = false) {
  const opts = {
    method,
    headers: { 'Authorization': 'Bearer ' + TOKEN },
  };
  if (body && !isForm) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  if (body && isForm)  { opts.body = body; }
  const res  = await fetch(API + path, opts);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { doLogout(); return null; }
  return data;
}

/* ── Toast ──────────────────────────────────────────────────── */
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  t.innerHTML = `<i class="fa ${icons[type] || 'fa-info-circle'}"></i>${msg}`;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

/* ── Login ──────────────────────────────────────────────────── */
async function doLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl    = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Please enter email and password.'; return; }

  const data = await api('POST', '/api/admin/auth/login', { email, password });
  if (!data) return;
  if (!data.success) { errEl.textContent = data.message || 'Login failed.'; return; }

  TOKEN = data.data.token;
  ADMIN = data.data.admin;
  localStorage.setItem('em_admin_token', TOKEN);
  localStorage.setItem('em_admin', JSON.stringify(ADMIN));
  showApp();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-password') === document.activeElement) doLogin();
});

/* ── Logout ─────────────────────────────────────────────────── */
async function doLogout() {
  await api('POST', '/api/admin/auth/logout');
  TOKEN = ''; ADMIN = null;
  localStorage.removeItem('em_admin_token');
  localStorage.removeItem('em_admin');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

/* ── Show app ───────────────────────────────────────────────── */
function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if (ADMIN) {
    document.getElementById('admin-name').textContent  = ADMIN.name;
    document.getElementById('admin-role').textContent  = ADMIN.role;
    document.getElementById('admin-avatar').textContent = ADMIN.name[0].toUpperCase();
  }
  const now = new Date();
  document.getElementById('header-date').textContent =
    now.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
  navigate('dashboard');

/* ── Navigation ─────────────────────────────────────────────── */
let currentPage = 'dashboard';
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  const titles = {
    dashboard:'Dashboard', products:'Products', categories:'Categories',
    orders:'Orders', coupons:'Coupons', customers:'Customers',
    reviews:'Reviews', settings:'Settings'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  const pages = { dashboard:renderDashboard, products:renderProducts, categories:renderCategories,
    orders:renderOrders, coupons:renderCoupons, customers:renderCustomers,
    reviews:renderReviews, settings:renderSettings };
  if (pages[page]) pages[page]();
}
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.page));
});

function setContent(html) { document.getElementById('content').innerHTML = html; }
function loading() { setContent('<div class="loader"><div class="spinner"></div> Loading…</div>'); }

      p = res.data;
      p.benefits     = Array.isArray(p.benefits)     ? p.benefits.join('\n')     : p.benefits     || '';
      p.applications = Array.isArray(p.applications) ? p.applications.join(', ') : p.applications || '';

    <div class="form-row">
      <div class="form-group"><label class="required">Price (₹)</label><input id="p-price" class="form-control" type="number" min="0" step="0.01" value="${p.price}" /></div>
      <div class="form-group"><label>Discount Price (₹)</label><input id="p-disc" class="form-control" type="number" min="0" step="0.01" value="${p.discount_price||''}" placeholder="Leave empty if no sale" /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="required">Stock Qty</label><input id="p-stock" class="form-control" type="number" min="0" value="${p.stock}" /></div>
      <div class="form-group"><label>Weight / Size</label><input id="p-weight" class="form-control" value="${esc(p.weight||'')}" placeholder="e.g. 1 kg, 5 kg, 1 Ltr" /></div>

    <div class="form-group"><label>Tagline</label><input id="p-tagline" class="form-control" value="${esc(p.tagline||'')}" placeholder="Short marketing tagline" /></div>
    <div class="form-group"><label>Short Description</label><textarea id="p-desc" class="form-control" rows="2">${esc(p.description||'')}</textarea></div>
    <div class="form-group"><label>Long Description</label><textarea id="p-longdesc" class="form-control" rows="3">${esc(p.long_description||'')}</textarea></div>
    <div class="form-group"><label>Benefits (one per line)</label><textarea id="p-benefits" class="form-control" rows="4" placeholder="Promotes strong root growth\nImproves soil health\n100% natural">${esc(p.benefits||'')}</textarea></div>

async function saveProduct(id = null) {
  const benefits     = (document.getElementById('p-benefits').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const applications = (document.getElementById('p-apps').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const data = {
    name:             document.getElementById('p-name').value,
    category_id:      document.getElementById('p-cat').value,
    sku:              document.getElementById('p-sku').value,
    type:             document.getElementById('p-type').value,
    badge:            document.getElementById('p-badge').value,
    tagline:          document.getElementById('p-tagline').value,
    description:      document.getElementById('p-desc').value,
    long_description: document.getElementById('p-longdesc').value,
    benefits,
    usage_info:       document.getElementById('p-usage').value,
    applications,
    price:            parseFloat(document.getElementById('p-price').value) || 0,
    discount_price:   document.getElementById('p-disc').value ? parseFloat(document.getElementById('p-disc').value) : null,
    stock:            parseInt(document.getElementById('p-stock').value) || 0,
    weight:           document.getElementById('p-weight').value,
    is_active:        document.getElementById('p-active').checked ? 1 : 0,
    is_featured:      document.getElementById('p-featured').checked ? 1 : 0,
    is_bestseller:    document.getElementById('p-bs').checked ? 1 : 0,
  };
  if (!data.name || !data.category_id || !data.price) { toast('Name, category and price are required.','error'); return; }
  const method = id ? 'PUT' : 'POST';
  const path   = id ? `/api/admin/products/${id}` : '/api/admin/products';
  const res    = await api(method, path, data);
  if (res?.success) { toast(id?'Product updated.':'Product created.','success'); closeModal(); renderProducts(prodPage); }
  else toast(res?.message || 'Save failed.','error');
}

async function deleteProduct(id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  const res = await api('DELETE', `/api/admin/products/${id}`);
  if (res?.success) { toast('Product deleted.','success'); renderProducts(prodPage); }
  else toast(res?.message || 'Delete failed.','error');
}

async function uploadProductImages(productId, input) {
  const files = input.files;
  for (let i = 0; i < files.length; i++) {
    const fd = new FormData();
    fd.append('image', files[i]);
    if (i === 0 && document.querySelectorAll('#img-preview-grid .img-thumb').length === 0) {
      fd.append('is_primary', '1');
    }
    const res = await api('POST', `/api/admin/products/${productId}/images`, fd, true);
    if (res?.success) {
      const d = res.data;
      const grid = document.getElementById('img-preview-grid');
      const div  = document.createElement('div');
      div.className = 'img-thumb';
      div.id = `imgthumb-${d.id}`;
      div.innerHTML = `<img src="${d.url}" /><button class="img-thumb-del" onclick="deleteProductImage(${productId},${d.id})">✕</button><button class="img-thumb-star" onclick="setPrimaryImg(${productId},${d.id})">Set Primary</button>`;
      grid.appendChild(div);
    }
  }
  input.value = '';
  toast('Images uploaded.','success');
}

async function deleteProductImage(productId, imageId) {
  if (!confirm('Delete this image?')) return;
  const res = await api('DELETE', `/api/admin/products/${productId}/images/${imageId}`);
  if (res?.success) { document.getElementById(`imgthumb-${imageId}`)?.remove(); toast('Image deleted.','success'); }
  else toast('Delete failed.','error');
}

async function setPrimaryImg(productId, imageId) {
  const res = await api('PATCH', `/api/admin/products/${productId}/images/${imageId}/primary`);
  if (res?.success) {
    document.querySelectorAll('.img-thumb-star').forEach(b => { b.textContent = 'Set Primary'; });
    document.querySelector(`#imgthumb-${imageId} .img-thumb-star`).textContent = '★ Primary';
    toast('Primary image set.','success');
  }
}

async function saveCoupon(id = null) {
  const data = { code: document.getElementById('cu-code').value.toUpperCase(), type: document.getElementById('cu-type').value, value: parseFloat(document.getElementById('cu-val').value)||0, min_order: parseFloat(document.getElementById('cu-min').value)||0, max_discount: document.getElementById('cu-maxd').value||null, usage_limit: document.getElementById('cu-limit').value||null, starts_at: document.getElementById('cu-start').value||null, expires_at: document.getElementById('cu-exp').value||null, is_active: document.getElementById('cu-active').checked?1:0 };
  if (!data.code || !data.value) { toast('Code and discount value required.','error'); return; }
  const res = await api(id?'PUT':'POST', id?`/api/admin/coupons/${id}`:'/api/admin/coupons', data);
  if (res?.success) { toast(id?'Coupon updated.':'Coupon created.','success'); closeModal(); renderCoupons(); }
  else toast(res?.message||'Save failed.','error');
}

  const res = await api('DELETE', `/api/admin/coupons/${id}`);
  if (res?.success) { toast('Coupon deleted.','success'); renderCoupons(); }
}

═══════════════════════════════════════════════════════════ */
function openModal(id, title, bodyHtml, saveCallback = null, showSaveBtn = true) {
  document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = id + '-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">${title}</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${showSaveBtn && saveCallback ? `<div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="currentModalSave()">${title.startsWith('Edit')?'Update':'Save'}</button></div>` : ''}
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target===overlay) closeModal(); });
  window._currentModalSave = saveCallback;
}
function currentModalSave() { if (window._currentModalSave) window._currentModalSave(); }
function closeModal() { document.querySelectorAll('.modal-overlay').forEach(m=>m.remove()); }

/* ═══════════════════════════════════════════════════════════
   PAGINATION
═══════════════════════════════════════════════════════════ */
function renderPagination(current, total, fn) {
  if (total <= 1) return '';
  let html = '<div class="pagination">';
  if (current > 1) html += `<button class="page-btn" onclick="${fn}(${current-1})">‹</button>`;
  const start = Math.max(1, current-2), end = Math.min(total, current+2);
  if (start > 1) html += `<button class="page-btn" onclick="${fn}(1)">1</button>${start>2?'<span class="page-info">…</span>':''}`;
  for (let i=start;i<=end;i++) html += `<button class="page-btn ${i===current?'active':''}" onclick="${fn}(${i})">${i}</button>`;
  if (end < total) html += `${end<total-1?'<span class="page-info">…</span>':''}<button class="page-btn" onclick="${fn}(${total})">${total}</button>`;
  if (current < total) html += `<button class="page-btn" onclick="${fn}(${current+1})">›</button>`;
  html += '</div>';
  return html;
}

/* ═══════════════════════════════════════════════════════════
   UTILITY
═══════════════════════════════════════════════════════════ */
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n) { return parseFloat(n||0).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }

/* ── Auto login if token exists ──────────────────────────── */
if (TOKEN && ADMIN) showApp();
